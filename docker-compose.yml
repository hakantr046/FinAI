services:
  postgres:
    image: postgres:16-alpine
    container_name: finai_postgres
    environment:
      POSTGRES_DB: finaidb
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Host'a port yayınlanmıyor — sadece compose ağı içindeki servisler (backend)
    # 'postgres' servis adı üzerinden erişir. Genel internete açık bir VPS'te
    # veritabanının doğrudan dışarıdan erişilebilir olması istenmez.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d finaidb"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai_service:
    build:
      context: ./src/ai_service
      dockerfile: Dockerfile
    container_name: finai_ai_service
    # Host'a port yayınlanmıyor — sadece backend, ağ içinden erişir.
    env_file:
      - path: ./src/ai_service/.env
        required: false

  backend:
    build:
      context: .
      dockerfile: backend/FinAI.Backend/Dockerfile
    container_name: finai_backend
    ports:
      - "5115:5115"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=finaidb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - AiService__GrpcAddress=http://ai_service:50051
      - Jwt__Key=${JWT_KEY:-}
      - Email__SenderEmail=${EMAIL_SENDER:-}
      - Email__SenderPassword=${EMAIL_SENDER_PASSWORD:-}
      - Frontend__BaseUrl=${FRONTEND_BASE_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      ai_service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    container_name: finai_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: finai_redis
    # Host'a port yayınlanmıyor — sadece compose ağı içinden erişilir.
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: finai_qdrant
    # Host'a port yayınlanmıyor — sadece compose ağı içinden erişilir.
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
