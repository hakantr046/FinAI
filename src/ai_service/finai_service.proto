syntax = "proto3";

package finai;

service FinAiService {
  rpc ParseTransaction (TransactionRequest) returns (TransactionResponse);
  rpc GenerateFinancialInsight (InsightRequest) returns (InsightResponse);
  rpc ChatWithAdvisor (ChatRequest) returns (ChatResponse);
  rpc ExtractReceiptData (ReceiptRequest) returns (ReceiptResponse);
  rpc DetectRecurringPayments (RecurringPaymentsRequest) returns (RecurringPaymentsResponse);
  rpc DetectAnomalies (AnomalyRequest) returns (AnomalyResponse);
  rpc CalculateGoalProjection (GoalProjectionRequest) returns (GoalProjectionResponse);
}

message TransactionRequest {
  string user_id = 1;
  string input_text = 2;
}

message TransactionResponse {
  bool is_successful = 1;
  string intent = 2;
  double amount = 3;
  string category = 4;
  string merchant_or_title = 5;
  string transaction_date = 6;
  float confidence_score = 7;
}

message InsightRequest {
  string user_id = 1;
  string transactions_summary_json = 2; // Harcama kategorileri ve tutarları JSON string olarak gelir
}

message InsightResponse {
  string insight_text = 1;
  string risk_level = 2; // Low, Medium, High
  repeated string recommendations = 3;
}

message ChatRequest {
  string user_id = 1;
  string message = 2;
  repeated ChatMessage history = 3;
  string context_json = 4;
}

message ChatMessage {
  string role = 1; // "user" veya "model"
  string content = 2;
}

message ChatResponse {
  string reply = 1;
}

message ReceiptRequest {
  string user_id = 1;
  bytes image_bytes = 2;
  string mime_type = 3;
}

message ReceiptResponse {
  bool is_successful = 1;
  string merchant_name = 2;
  double total_amount = 3;
  string category = 4;
  string date_str = 5;
  string items_json = 6;
  float confidence_score = 7;
}

message RecurringPaymentsRequest {
  string user_id = 1;
  string transactions_json = 2;
}

message RecurringPaymentsResponse {
  bool is_successful = 1;
  string detected_subscriptions_json = 2;
}

message AnomalyRequest {
  string user_id = 1;
  string transactions_json = 2;
}

message AnomalyResponse {
  bool is_successful = 1;
  string anomalies_json = 2;
}

message GoalProjectionRequest {
  string user_id = 1;
  string goal_title = 2;
  double target_amount = 3;
  double current_amount = 4;
  string deadline_date = 5;
}

message GoalProjectionResponse {
  bool is_successful = 1;
  string estimated_completion_date = 2;
  double recommended_monthly_saving = 3;
  string advice_text = 4;
}